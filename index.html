<script>
const B=[
{img:'gibbydayicon.png',n:'Gibby Day Countdown',u:'https://gibbymonster.github.io/gibbyday'},
{img:'betaflame.png',n:'betapcs',u:'https://gibbymonster.github.io/betapcs'},
{img:'notebookinc.png',n:'Notebook Inc',u:'https://thegibbymonster.github.io/notebookinc/'}];
const g=document.getElementById('g');
B.forEach(s=>{const a=document.createElement('a');a.className='c';a.href=s.u;a.target='_blank';a.rel='noopener';
a.innerHTML='<img alt=""><b></b><small></small><em>↗</em>';
a.querySelector('img').src=s.img;a.querySelector('b').textContent=s.n;a.querySelector('small').textContent=s.u.replace(/^https?:\/\//,'');
a.onmousemove=e=>{const r=a.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
a.style.setProperty('--x',x+'px');a.style.setProperty('--y',y+'px');
a.style.transform=`rotateX(${(.5-y/r.height)*12}deg) rotateY(${(x/r.width-.5)*12}deg) scale(1.03)`};
a.onmouseleave=()=>a.style.transform='';
g.append(a)});
const T=document.createElement('div');T.className='t';document.body.append(T);
let tt;function say(m){T.textContent=m;T.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>T.classList.remove('on'),2600)}
function boom(){for(let i=0;i<90;i++){const c=document.createElement('i');c.className='cf';
c.style.left=Math.random()*100+'vw';c.style.background=`hsl(${Math.random()*360} 100% 60%)`;
c.style.animationDelay=Math.random()*.6+'s';document.body.append(c);setTimeout(()=>c.remove(),3200)}}
const logo=document.querySelector('.logo'),tag=document.querySelector('.s'),tag0=tag.textContent;let n=0,tm;
logo.onclick=()=>{n++;clearTimeout(tm);tm=setTimeout(()=>n=0,1500);
if(n>=5){n=0;logo.classList.add('spin');setTimeout(()=>logo.classList.remove('spin'),1000);boom();say('you found gibby!')}};
const K=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];let ki=0,typed='',rbT;
addEventListener('keydown',e=>{
if(e.key==='Escape'){document.body.classList.remove('rb','mon');tag.textContent=tag0}
ki=e.key===K[ki]?ki+1:(e.key===K[0]?1:0);
if(ki===K.length){ki=0;document.body.classList.add('rb');clearTimeout(rbT);rbT=setTimeout(()=>document.body.classList.remove('rb'),8000);boom();say('rainbow mode')}
if(e.key.length===1){typed=(typed+e.key.toLowerCase()).slice(-8);
if(typed.endsWith('gibby')){boom();say('hi -gibby')}
if(typed.endsWith('monster')){
const on=document.body.classList.toggle('mon');
tag.textContent=on?"👹👹👹👹👹👹👹👹👹👹👹👹👹👹👹👹👹👹👹👹":tag0;
say(on?'👹 MONSTER MODE... type monster to escape':'phew, it left')
}
}});
tag.ondblclick=()=>{boom();say('nice double click')};
console.log('%c psst... dont type monster on your keyboard','font:bold 16px system-ui;color:#8b5cff');
</script>
