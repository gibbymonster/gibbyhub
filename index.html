<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gibbyhub.xyz</title>
<link rel="icon" href="gibbyhublogo.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3595698097881761"
     crossorigin="anonymous"></script>
<style>
:root{--bg:#0a0302;--fg:#fff1d6;--mut:#c98a6a;--a:#ff4d00;--b:#ff1a1a;--c:#ffb400;--row:#ffffff0d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Bricolage Grotesque',system-ui,sans-serif;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.heat{position:fixed;left:0;right:0;bottom:0;height:55vh;z-index:0;pointer-events:none;background:radial-gradient(ellipse 90% 100% at 50% 110%,var(--b),var(--a) 25%,transparent 70%);opacity:.5;animation:hb 3s ease-in-out infinite alternate;transform-origin:bottom}
@keyframes hb{to{opacity:.8;transform:scaleY(1.15)}}
.wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(340px,44%) 1fr;gap:16px;min-height:100vh;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
aside{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));height:calc(100vh - 32px - env(safe-area-inset-top,0px));padding:40px 36px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid #ff4d0055;border-radius:44px;background:#1a0a06b0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 50px #ff4d0033}
.logo{width:110px;height:110px;object-fit:contain;filter:url(#heat) drop-shadow(0 0 24px var(--a));cursor:pointer;transition:transform .3s}
.logo:hover{transform:rotate(-8deg) scale(1.1)}
h1{margin:0;font-family:Fredoka,'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:min(calc((44vw - 80px)/7.4),6.2rem);line-height:1;white-space:nowrap;text-transform:lowercase;letter-spacing:.01em;cursor:default;filter:url(#heat)}
h1 span{display:inline-block;background:linear-gradient(0deg,var(--b),var(--a) 45%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;animation:fl 1.6s ease-in-out infinite alternate;filter:drop-shadow(0 0 18px #ff4d0088)}
h1 span+span{animation-delay:-.8s;background-image:linear-gradient(0deg,var(--a),var(--c) 60%,#fff6c8)}
@keyframes fl{0%{filter:drop-shadow(0 0 10px #ff4d0066) brightness(.95)}100%{filter:drop-shadow(0 0 28px #ffb400aa) brightness(1.2)}}
.s{margin:18px 0 0;color:var(--mut);font-size:1.05rem;min-height:1.5em}
.s::after{content:"_";color:var(--c);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.q{width:100%;padding:14px 24px;border:2px solid #ff4d0066;border-radius:99px;background:#ffffff10;color:var(--fg);font:inherit;font-size:1.15rem;outline:0;transition:border-color .3s}
.q:focus{border-color:var(--c)}
.q::placeholder{color:var(--mut)}
.ft{margin-top:14px;color:var(--mut);font-size:.9rem}
.ft b{color:var(--c)}
main{padding:24px 12px 60px;align-self:center}
.g{display:flex;flex-direction:column;gap:14px}
.c{position:relative;display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:22px;padding:16px 30px 16px 16px;color:var(--fg);text-decoration:none;border:2px solid #ffffff1c;border-radius:999px;background:#ffffff0a;overflow:hidden;isolation:isolate;transition:padding .35s cubic-bezier(.2,.8,.2,1),color .25s;animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateX(60px)}}
.c::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--b),var(--a),var(--c));transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.c:hover,.c:focus-visible{padding-left:30px;color:#1a0500;outline:0}
.c:hover::before,.c:focus-visible::before{transform:scaleX(1)}
.c img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#2a0f05;border:3px solid var(--a);transition:transform .45s,border-color .3s}
.c:hover img{transform:rotate(360deg) scale(1.12);border-color:#1a0500}
.c b{font-family:Fredoka,'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:clamp(1.5rem,3.4vw,2.5rem);text-transform:lowercase;letter-spacing:.02em;line-height:1}
.c small{display:block;margin-top:6px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch;transition:color .25s}
.c:hover small{color:#1a0500b0}
.c em{font-style:normal;font-size:2rem;transition:transform .35s}
.c:hover em{transform:translate(6px,-6px) rotate(10deg)}
.c.h{display:none}
.no{display:none;color:var(--mut);padding:30px 18px}
.hm{margin-top:18px;height:16px;border:2px solid var(--a);border-radius:99px;padding:2px;position:relative}
.hm i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--a),var(--b));box-shadow:0 0 14px var(--a)}
.hm::after{content:"heat";position:absolute;right:0;top:-1.5em;font-size:.8rem;color:var(--mut)}
body.inf main,body.inf aside{animation:qk .08s infinite}
body.inf .heat{opacity:1;height:90vh}
@keyframes qk{25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,3px)}}
.t{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);background:var(--a);color:#1a0500;padding:12px 26px;border-radius:99px;font-family:Fredoka,'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:1.1rem;letter-spacing:.04em;opacity:0;transition:.3s;z-index:9;box-shadow:0 0 40px var(--a);pointer-events:none}
.t.on{opacity:1;transform:translate(-50%,0)}
.spin{animation:sp 1s ease-in-out!important}
@keyframes sp{to{transform:rotate(720deg) scale(1.4)}}
body.rb{animation:hu 3s linear infinite}
@keyframes hu{to{filter:hue-rotate(360deg)}}
.cf{position:fixed;top:-20px;width:12px;height:12px;border-radius:50%;z-index:8;pointer-events:none;animation:fl2 2.4s ease-in forwards}
@keyframes fl2{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}

body.mon{--bg:#020a02;--fg:#e6ffe0;--mut:#6fb36a;--a:#39ff14;--b:#0a6b0a;--c:#c6ff00}
body.mon h1 span{animation:sh .3s infinite}
body.mon .c{animation:sh .4s infinite}
body.mon::after{content:"";position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(circle,transparent 35%,#000000d0 100%)}
body.mon main{animation:fk 2.5s infinite}
@keyframes sh{25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@keyframes fk{0%,100%{opacity:1}6%{opacity:.35}8%{opacity:1}52%{opacity:1}54%{opacity:.5}56%{opacity:1}}

@media (max-width:820px){
.wrap{grid-template-columns:1fr}
h1{font-size:min(calc((100vw - 44px)/7.4),5rem)}
aside{position:static;height:auto;gap:28px;padding:32px 24px 24px;border-radius:36px}
main{padding:6px 0 60px}
.c{grid-template-columns:52px 1fr auto;gap:14px;padding:12px 20px 12px 12px}
.c img{width:52px;height:52px}
}
@media (prefers-reduced-motion:reduce){h1,.logo{filter:none}*{animation:none!important;transition:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="heat" x="-5%" y="-15%" width="110%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="3" result="n"><animate attributeName="baseFrequency" dur="6s" values="0.012 0.06;0.02 0.1;0.012 0.06" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="9"/></filter></svg>
<div class="heat"></div>
<canvas id="fx"></canvas>
<div class="wrap">
<aside>
<div>
<img class="logo" src="gibbyhublogo.png" alt="Gibby Hub logo">
</div>
<div>
<h1 id="h1"><span>gibbyhub</span><span>.xyz</span></h1>
<p class="s" id="tag"></p>
</div>
<div>
<input class="q" id="q" type="search" placeholder="find a site... ( / )" autocomplete="off" aria-label="Search sites">
<p class="ft"><b id="cnt"></b> sites on fire</p>
<div class="hm"><i id="hb"></i></div>
</div>
</aside>
<main>
<div class="g" id="g"></div>
<p class="no" id="no">nothing burning here. try another word.</p>
</main>
</div>
<script>
const B=[
{img:'gibbydayicon.png',n:'Gibby Day Countdown',u:'https://gibbymonster.github.io/gibbyday'},
{img:'image_2026-11-15_075028356.png',n:'Gibbys Christmas Hub',u:'https://gibbymonster.github.io/gibbyschristmashub'},
{img:'image_2026-11-15_075232227.png',n:'Aura Battle',u:'https://gibbymonster.github.io/aurabattle'},
{img:'image_2026-11-15_075359201.png',n:'Neon Runner',u:'https://gibbymonster.github.io/neonrunner'},
{img:'favicon.png',n:'The Tales of Doctor Duffy',u:'https://gibbymonster.github.io/thetalesofdoctorduffy/'},
{img:'summerbreak.png',n:'Summer Break Countdown',u:'https://gibbymonster.github.io/majorfamcounts/'},
{img:'favicon.svg',n:'Night Cruiser',u:'https://gibbymonster.github.io/nightcruiser'},
{img:'cmas.png',n:'Fridays Until Christmas',u:'https://gibbymonster.github.io/fridaysuntilchristmas'},
{img:'leifbdayicon.png',n:'Leif Birthday Countdown',u:'https://gibbymonster.github.io/leifsbday'},
{img:'betaflame.png',n:'betapcs',u:'https://gibbymonster.github.io/betapcs'},
{img:'notebookinc.png',n:'Notebook Inc',u:'https://thegibbymonster.github.io/notebookinc/'}];
const g=document.getElementById('g'),cards=[];
B.forEach((s,i)=>{const a=document.createElement('a');a.className='c';a.href=s.u;a.target='_blank';a.rel='noopener';a.style.animationDelay=(.1+i*.07)+'s';
a.innerHTML='<img alt=""><div><b></b><small></small></div><em>↗</em>';
a.querySelector('img').src=s.img;a.querySelector('b').textContent=s.n;a.querySelector('small').textContent=s.u.replace(/^https?:\/\//,'');
a.onanimationend=()=>a.style.animation='none';
g.append(a);cards.push([a,s.n.toLowerCase()+' '+s.u])});
document.getElementById('cnt').textContent=B.length;
const q=document.getElementById('q'),no=document.getElementById('no');
q.oninput=()=>{const v=q.value.trim().toLowerCase();let k=0;
cards.forEach(([a,t])=>{const m=!v||t.includes(v);a.classList.toggle('h',!m);if(m)k++});no.style.display=k?'none':'block'};
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});

/* typed tagline */
const tag=document.getElementById('tag'),lines=['all of my sites on this one site','11 sites. 1 hub. 0 chill.','click the logo 5 times','psst... try the konami code'];
const tag0=lines[0];let li=0,ci=0,del=false,pause=0,mon=false;
setInterval(()=>{if(mon)return;if(pause>0){pause--;return}
const L=lines[li];ci+=del?-1:1;tag.textContent=L.slice(0,ci);
if(!del&&ci===L.length){del=true;pause=26}else if(del&&ci===0){del=false;li=(li+1)%lines.length}},55);

/* embers + sparks + heat meter */
const cv=document.getElementById('fx'),x=cv.getContext('2d'),hb=document.getElementById('hb');let W,H,E=[],S=[],mx=-999,my=-999,heat=0,inf=false;
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function mk(init){return{x:Math.random()*W,y:init?Math.random()*H:H+10,r:Math.random()*2.6+.8,vy:Math.random()*1.1+.4,ph:Math.random()*6.3,k:Math.random()}}
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;E=Array.from({length:Math.min(130,W*H/9000|0)},()=>mk(1))}
rs();addEventListener('resize',rs);
function burst(px,py,n,sp){for(let i=0;i<n;i++){const an=Math.random()*6.3,v=Math.random()*(sp||5)+1;S.push({x:px,y:py,vx:Math.cos(an)*v,vy:Math.sin(an)*v-1.5,l:1,r:Math.random()*2.4+.8,k:Math.random()})}}
function addHeat(v){if(inf)return;heat=Math.min(100,heat+v);if(heat>=100){inf=true;document.body.classList.add('inf');boom();say('🔥 INFERNO 🔥');setTimeout(()=>{inf=false;heat=0;document.body.classList.remove('inf')},3500)}}
cards.forEach(([a])=>a.addEventListener('pointerenter',e=>{addHeat(9);burst(e.clientX,e.clientY,16,6)}));
let lt=0;addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;const n=Date.now();if(n-lt>30){lt=n;S.push({x:mx,y:my,vx:(Math.random()-.5)*1.2,vy:-Math.random()*1.8-.4,l:1,r:Math.random()*2.6+1,k:Math.random()})}});
addEventListener('pointerdown',e=>{burst(e.clientX,e.clientY,40,8);addHeat(4)});
function loop(t){x.clearRect(0,0,W,H);const cs=getComputedStyle(document.body),cols=[cs.getPropertyValue('--a').trim(),cs.getPropertyValue('--c').trim(),cs.getPropertyValue('--b').trim()];
const m=inf?3.2:1;if(inf&&Math.random()<.9)burst(Math.random()*W,H,3,3);
for(const p of E){p.y-=p.vy*m;p.x+=Math.sin(t/900+p.ph)*.6;
const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<120){p.x+=dx/d*3;p.y+=dy/d*3}
if(p.y<-10)Object.assign(p,mk(0));
x.globalAlpha=Math.min(1,p.y/H*1.6)*.9;x.fillStyle=cols[p.k*3|0];x.shadowColor=x.fillStyle;x.shadowBlur=10;
x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill()}
for(let i=S.length-1;i>=0;i--){const p=S[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.018;
if(p.l<=0){S.splice(i,1);continue}
x.globalAlpha=p.l;x.fillStyle=cols[p.k*3|0];x.shadowColor=x.fillStyle;x.shadowBlur=14;x.beginPath();x.arc(p.x,p.y,p.r*p.l+.4,0,6.3);x.fill()}
if(S.length>900)S.splice(0,S.length-900);
if(!inf)heat=Math.max(0,heat-.12);hb.style.width=heat+'%';
requestAnimationFrame(loop)}
if(!rm)requestAnimationFrame(loop);

/* toast, confetti, eggs */
const T=document.createElement('div');T.className='t';document.body.append(T);
let tt;function say(m){T.textContent=m;T.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>T.classList.remove('on'),2600)}
function boom(){for(let i=0;i<110;i++){const c=document.createElement('i');c.className='cf';
c.style.left=Math.random()*100+'vw';c.style.background=`hsl(${Math.random()*60} 100% 55%)`;
c.style.animationDelay=Math.random()*.6+'s';document.body.append(c);setTimeout(()=>c.remove(),3200)}}
const logo=document.querySelector('.logo');let n=0,tm;
logo.onclick=()=>{n++;clearTimeout(tm);tm=setTimeout(()=>n=0,1500);
if(n>=5){n=0;logo.classList.add('spin');setTimeout(()=>logo.classList.remove('spin'),1000);boom();say('YOU FOUND GIBBY!')}};
const K=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];let ki=0,typed='',rbT;
addEventListener('keydown',e=>{
if(e.key==='Escape'){document.body.classList.remove('rb','mon');mon=false;q.blur()}
if(document.activeElement===q)return;
ki=e.key===K[ki]?ki+1:(e.key===K[0]?1:0);
if(ki===K.length){ki=0;document.body.classList.add('rb');clearTimeout(rbT);rbT=setTimeout(()=>document.body.classList.remove('rb'),8000);boom();say('RAINBOW MODE')}
if(e.key.length===1){typed=(typed+e.key.toLowerCase()).slice(-8);
if(typed.endsWith('gibby')){boom();say('HI -GIBBY')}
if(typed.endsWith('monster')){mon=document.body.classList.toggle('mon');
tag.textContent=mon?'roarrrghh':tag0;
say(mon?'👹 MONSTER MODE... TYPE MONSTER TO ESCAPE':'PHEW, IT LEFT')}}});
document.getElementById('h1').ondblclick=()=>{boom();say('NICE DOUBLE CLICK')};
console.log('%c👀 psst... dont type monster on your keyboard','font:bold 16px system-ui;color:#ff4d00');
</script></body></html>
